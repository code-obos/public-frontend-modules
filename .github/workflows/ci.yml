name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟧 Setup pnpm, node and install dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          # pnpm version and node runtime are read from package.json's
          # `packageManager` and `devEngines.runtime` fields.
          cache: true
          install: true

      - name: 💅 Format check
        run: pnpm run fmt:check

      - name: 🔍 Lint
        run: pnpm run lint

      - name: 🧪 Run tests
        run: pnpm run test:ci

      - name: 🏗 Build lib
        run: pnpm run build
